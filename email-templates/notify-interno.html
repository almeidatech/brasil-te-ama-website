<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="x-apple-disable-message-reformatting">
<title>Nova mensagem pelo site</title>
</head>
<body style="margin:0;padding:0;background:#FBF9F9;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#FBF9F9;">
  <tr><td align="center" style="padding:24px 16px;">
    <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background:#FFFFFF;border:1px solid #E5DDDE;border-radius:12px;overflow:hidden;">
      <tr><td style="padding:18px 32px 12px;border-top:4px solid #8E1F2D;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0"><tr>
          <td style="vertical-align:middle;">
            <img src="https://institutobrasilteama.org/assets/logo-principal.png" alt="Brasil te Ama" width="32" style="display:inline-block;vertical-align:middle;border:0;outline:none;height:auto;width:32px;margin-right:10px;">
            <span style="font-family:Georgia,'Times New Roman',serif;font-size:16px;font-weight:700;color:#8E1F2D;vertical-align:middle;">Brasil te Ama · Admin</span>
          </td>
          <td align="right" style="vertical-align:middle;font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#7B726F;">{{submitted_at}}</td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:6px 32px 8px;font-family:Arial,Helvetica,sans-serif;">
        <h1 style="font-family:Georgia,'Times New Roman',serif;font-size:21px;font-weight:700;color:#222222;margin:0 0 4px;">Nova mensagem: {{form_label}}</h1>
        <p style="margin:0 0 18px;font-size:13px;color:#7B726F;">Recebida pelo formulário do site.</p>
      </td></tr>
      <tr><td style="padding:0 32px 8px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222222;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="border:1px solid #E5DDDE;border-radius:8px;overflow:hidden;">
          <tr><td style="padding:10px 14px;background:#FBF9F9;width:120px;font-weight:700;color:#8E1F2D;border-bottom:1px solid #E5DDDE;">Nome</td><td style="padding:10px 14px;border-bottom:1px solid #E5DDDE;">{{name}}</td></tr>
          <tr><td style="padding:10px 14px;background:#FBF9F9;font-weight:700;color:#8E1F2D;border-bottom:1px solid #E5DDDE;">E-mail</td><td style="padding:10px 14px;border-bottom:1px solid #E5DDDE;"><a href="mailto:{{email}}" style="color:#8E1F2D;">{{email}}</a></td></tr>
          <tr><td style="padding:10px 14px;background:#FBF9F9;font-weight:700;color:#8E1F2D;">Telefone</td><td style="padding:10px 14px;">{{phone}}</td></tr>
        </table>
      </td></tr>
      <tr><td style="padding:16px 32px 8px;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#8E1F2D;font-weight:700;">Detalhes</td></tr>
      <tr><td style="padding:0 32px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;color:#222222;">
        <div style="white-space:pre-line;background:#FBF9F9;border:1px solid #E5DDDE;border-radius:8px;padding:14px 16px;line-height:1.7;">{{details}}</div>
      </td></tr>
      <tr><td style="padding:8px 32px 26px;">
        <table role="presentation" cellpadding="0" cellspacing="0"><tr>
          <td style="border-radius:999px;background:#8E1F2D;">
            <a href="https://institutobrasilteama.org/admin/submissions" style="display:inline-block;padding:11px 24px;font-family:Arial,Helvetica,sans-serif;font-size:14px;font-weight:700;color:#FFFFFF;text-decoration:none;border-radius:999px;">Abrir na triagem</a>
          </td>
        </tr></table>
      </td></tr>
      <tr><td style="padding:16px 32px;background:#3A3F47;font-family:Arial,Helvetica,sans-serif;color:#8A8F97;font-size:11px;line-height:1.6;">
        Notificação automática · Instituto Brasil te Ama · Responder este e-mail responde diretamente a <strong style="color:#C8C4C2;">{{name}}</strong>.
      </td></tr>
    </table>
  </td></tr>
</table>
</body>
</html>
