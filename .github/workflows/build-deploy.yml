name: Build & Deploy (brasilteama)

on:
  push:
    branches: [master, main]
    paths-ignore:
      - "design-system/**"
      - "design-assets/**"
      - "docs/**"
      - "architecture/**"
      - "*.md"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/brasil-te-ama

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_SITE_URL=https://brasilteama.alcgestao.com.br
            NEXT_PUBLIC_NOINDEX=true
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENV=production
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # A porta 22 do servidor nao fica exposta na internet. O runner entra
      # na rede Tailscale como no efemero e alcanca o host pelo IP 100.x.
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Install SSH key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H ${{ secrets.VPS_HOST }} >> ~/.ssh/known_hosts

      - name: Copy stack file
        run: |
          scp deploy/stack.yml root@${{ secrets.VPS_HOST }}:/root/brasilteama-stack.yml

      - name: Deploy stack
        env:
          GHCR_OWNER: ${{ github.repository_owner }}
          IMAGE_TAG: ${{ needs.build-and-push.outputs.image_tag }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          REVALIDATE_SECRET: ${{ secrets.REVALIDATE_SECRET }}
          ZEPTO_API_TOKEN: ${{ secrets.ZEPTO_API_TOKEN }}
          GOOGLE_TRANSLATE_API_KEY: ${{ secrets.GOOGLE_TRANSLATE_API_KEY }}
        run: |
          ssh root@${{ secrets.VPS_HOST }} \
            "echo '${{ secrets.GHCR_PAT }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin && \
             GHCR_OWNER='$GHCR_OWNER' IMAGE_TAG='$IMAGE_TAG' \
             NEXT_PUBLIC_SUPABASE_URL='$NEXT_PUBLIC_SUPABASE_URL' \
             NEXT_PUBLIC_SUPABASE_ANON_KEY='$NEXT_PUBLIC_SUPABASE_ANON_KEY' \
             SUPABASE_SERVICE_ROLE_KEY='$SUPABASE_SERVICE_ROLE_KEY' \
             REVALIDATE_SECRET='$REVALIDATE_SECRET' \
             ZEPTO_API_TOKEN='$ZEPTO_API_TOKEN' \
             GOOGLE_TRANSLATE_API_KEY='$GOOGLE_TRANSLATE_API_KEY' \
             docker stack deploy -c /root/brasilteama-stack.yml brasilteama --with-registry-auth --detach=false"

      - name: Wait for service health
        run: |
          # Sonda o host de PRODUÇÃO. Até 2026-08-11 este passo sondava
          # brasilteama.alcgestao.com.br, que saiu do DNS e passou a responder
          # HTTP 000 — o deploy aplicava normalmente e o job falhava depois,
          # dando "deploy vermelho" para uma entrega que estava no ar.
          HEALTH_URL="${HEALTH_URL:-https://institutobrasilteama.org/}"
          for i in {1..30}; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "$HEALTH_URL" || true)
            echo "Attempt $i: HTTP $code ($HEALTH_URL)"
            if [ "$code" = "200" ]; then exit 0; fi
            sleep 10
          done
          echo "Service did not become healthy in time"; exit 1
