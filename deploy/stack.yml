version: "3.9"

# Docker Swarm stack for Brasil te Ama
#
# Deploy: o workflow build-deploy.yml faz `scp deploy/stack.yml` para
# /root/brasilteama-stack.yml na VPS2 e roda `docker stack deploy` a partir
# DESTE arquivo. Ou seja: este arquivo é a fonte da verdade e sobrescreve o
# que estiver no servidor a cada push.
#
# Produção: institutobrasilteama.org      (+ www, que redireciona para o apex)
#
# Staging: removido em 2026-08-13. O host brasilteama.alcgestao.com.br não
# resolve mais em DNS, então os routers de staging (e o middleware
# brasil-noindex, usado só por eles) viravam configuração morta no Traefik.
#
# ⚠️ RECONCILIAÇÃO 2026-08-11 — este arquivo estava DEFASADO em relação ao que
# rodava em produção, em três pontos, cada um capaz de causar um incidente:
#
#   1. não declarava os routers de produção (só os de staging), então o próximo
#      deploy removeria o router de institutobrasilteama.org e o site sairia
#      do ar com HTTP 404;
#   2. NEXT_PUBLIC_NOINDEX estava "true" — o deploy marcaria a produção inteira
#      como noindex/nofollow;
#   3. NEXT_PUBLIC_SITE_URL apontava para o host de staging, o que quebraria
#      canonical, sitemap e OG do site de produção.
#
# Os routers de produção tinham sido criados direto no servidor e nunca
# voltaram para cá. Regra: NADA de `docker service update` como correção
# definitiva neste stack — o próximo deploy sobrescreve. A mudança vem sempre
# por este arquivo.

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-almeidatech}/brasil-te-ama:${IMAGE_TAG:-latest}
    networks:
      - olmedaNet
    environment:
      NODE_ENV: production
      # Produção é o default. O ambiente de staging sobrescreve os dois via env
      # no momento do deploy — nunca editando este arquivo, para não repetir a
      # divergência de 2026-08-11.
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://institutobrasilteama.org}
      NEXT_PUBLIC_NOINDEX: "${NEXT_PUBLIC_NOINDEX:-false}"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Google Cloud Translation — usado pelo botão "Traduzir" por idioma no
      # editor de posts (/api/admin/translate-post). As páginas estáticas já
      # vêm traduzidas no build (cache _i18n), então não dependem desta chave.
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      # ZeptoMail (Fase 4) — notificações dos formulários. Token = secret;
      # endereços = config não-sensível (transitória: usam domínio olmeda
      # verificado até a migração p/ institutobrasilteama.org).
      ZEPTO_API_TOKEN: ${ZEPTO_API_TOKEN}
      CONTACT_FROM_EMAIL: "noreply@olmedapetstudio.com"
      CONTACT_FROM_NAME: "Instituto Brasil te Ama"
      CONTACT_TO_EMAIL: "contato@olmedatech.com"
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=olmedaNet"

        # ---------- PRODUÇÃO: institutobrasilteama.org (+ www) ----------
        # HTTP (entrypoint web) — o redirect global do Traefik manda para websecure
        - "traefik.http.routers.brasilteama-prod-http.entrypoints=web"
        - "traefik.http.routers.brasilteama-prod-http.rule=Host(`institutobrasilteama.org`) || Host(`www.institutobrasilteama.org`)"
        # HTTPS
        - "traefik.http.routers.brasilteama-prod-https.entrypoints=websecure"
        - "traefik.http.routers.brasilteama-prod-https.rule=Host(`institutobrasilteama.org`) || Host(`www.institutobrasilteama.org`)"
        - "traefik.http.routers.brasilteama-prod-https.service=brasilteama-svc"
        - "traefik.http.routers.brasilteama-prod-https.tls=true"
        - "traefik.http.routers.brasilteama-prod-https.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.brasilteama-prod-https.middlewares=brasilteama-www-redirect"

        # www → apex, 301 permanente.
        # Até 2026-08-11 o `www` tinha DNS no Cloudflare mas NÃO estava na regra
        # do router: caía no catch-all do Traefik e respondia 404.
        #
        # Dois cuidados de sintaxe aqui:
        #   • aspas SIMPLES no YAML, senão as barras invertidas do regex viram
        #     escapes inválidos e o parser rejeita o arquivo;
        #   • `$${1}` e não `${1}` — o Compose interpola `${...}` antes de
        #     entregar ao Swarm, e `${1}` viraria string vazia (o redirect
        #     perderia o path). `$$` produz um `$` literal no label final.
        - 'traefik.http.middlewares.brasilteama-www-redirect.redirectregex.regex=^https?://www\.institutobrasilteama\.org/(.*)'
        - 'traefik.http.middlewares.brasilteama-www-redirect.redirectregex.replacement=https://institutobrasilteama.org/$${1}'
        - "traefik.http.middlewares.brasilteama-www-redirect.redirectregex.permanent=true"

        # ---------- Service / loadbalancer ----------
        - "traefik.http.services.brasilteama-svc.loadbalancer.server.port=3000"
        - "traefik.http.services.brasilteama-svc.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.brasilteama-svc.loadbalancer.healthcheck.interval=30s"

networks:
  olmedaNet:
    external: true
