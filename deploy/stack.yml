version: "3.9"

# Docker Swarm stack for Brasil te Ama
# Deployed via: docker stack deploy -c stack.yml brasilteama
#
# Official domain (público, indexado): institutobrasilteama.org
# Legacy/staging (301 permanente → oficial): brasilteama.alcgestao.com.br

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-almeidatech}/brasil-te-ama:${IMAGE_TAG:-latest}
    networks:
      - olmedaNet
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://institutobrasilteama.org
      NEXT_PUBLIC_NOINDEX: "false"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
      # Google Cloud Translation — usado pelo botão "Traduzir" por idioma no
      # editor de posts (/api/admin/translate-post). As páginas estáticas já
      # vêm traduzidas no build (cache _i18n), então não dependem desta chave.
      GOOGLE_TRANSLATE_API_KEY: ${GOOGLE_TRANSLATE_API_KEY}
      # ZeptoMail (Fase 4) — notificações dos formulários. Token = secret;
      # endereços = config não-sensível (transitória: usam domínio olmeda
      # verificado até a migração p/ institutobrasilteama.org).
      ZEPTO_API_TOKEN: ${ZEPTO_API_TOKEN}
      CONTACT_FROM_EMAIL: "noreply@olmedapetstudio.com"
      CONTACT_FROM_NAME: "Instituto Brasil te Ama"
      CONTACT_TO_EMAIL: "contato@olmedatech.com"
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=olmedaNet"

        # ── Domínio OFICIAL — serve o app (HTTP→HTTPS via redirect global do Traefik) ──
        - "traefik.http.routers.brasilteama-official.entrypoints=websecure"
        - "traefik.http.routers.brasilteama-official.rule=Host(`institutobrasilteama.org`)"
        - "traefik.http.routers.brasilteama-official.tls=true"
        - "traefik.http.routers.brasilteama-official.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.brasilteama-official.service=brasilteama-svc"

        # ── Domínio PROVISÓRIO — 301 permanente para o oficial (preserva o path) ──
        # $$ escapa o $ do compose para o Traefik receber ${1}.
        - "traefik.http.middlewares.brasilteama-to-official.redirectregex.regex=^https?://brasilteama\\.alcgestao\\.com\\.br/(.*)"
        - "traefik.http.middlewares.brasilteama-to-official.redirectregex.replacement=https://institutobrasilteama.org/$${1}"
        - "traefik.http.middlewares.brasilteama-to-official.redirectregex.permanent=true"
        - "traefik.http.routers.brasilteama-legacy.entrypoints=websecure"
        - "traefik.http.routers.brasilteama-legacy.rule=Host(`brasilteama.alcgestao.com.br`)"
        - "traefik.http.routers.brasilteama-legacy.tls=true"
        - "traefik.http.routers.brasilteama-legacy.tls.certresolver=letsencryptresolver"
        - "traefik.http.routers.brasilteama-legacy.middlewares=brasilteama-to-official"
        - "traefik.http.routers.brasilteama-legacy.service=brasilteama-svc"

        # ── Service / loadbalancer ──
        - "traefik.http.services.brasilteama-svc.loadbalancer.server.port=3000"
        - "traefik.http.services.brasilteama-svc.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.brasilteama-svc.loadbalancer.healthcheck.interval=30s"

networks:
  olmedaNet:
    external: true
