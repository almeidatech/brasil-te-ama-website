version: "3.9"

# Docker Swarm stack for Brasil te Ama
# Deployed via: docker stack deploy -c stack.yml brasilteama
#
# Staging domain: brasilteama.alcgestao.com.br
# Official domain (após aprovação do dono): institutobrasilteama.org

services:
  web:
    image: ghcr.io/${GHCR_OWNER:-almeidatech}/brasil-te-ama:${IMAGE_TAG:-latest}
    networks:
      - olmedaNet
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_SITE_URL: https://brasilteama.alcgestao.com.br
      NEXT_PUBLIC_NOINDEX: "true"
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY}
      REVALIDATE_SECRET: ${REVALIDATE_SECRET}
    deploy:
      mode: replicated
      replicas: 1
      update_config:
        parallelism: 1
        order: start-first
        failure_action: rollback
        delay: 10s
      restart_policy:
        condition: on-failure
        max_attempts: 3
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          memory: 128M
      labels:
        - "traefik.enable=true"
        - "traefik.docker.network=olmedaNet"
        # HTTP (entrypoint web) — Traefik global redirect already sends to websecure
        - "traefik.http.routers.brasilteama-http.entrypoints=web"
        - "traefik.http.routers.brasilteama-http.rule=Host(`brasilteama.alcgestao.com.br`)"
        # HTTPS
        - "traefik.http.routers.brasilteama-https.entrypoints=websecure"
        - "traefik.http.routers.brasilteama-https.rule=Host(`brasilteama.alcgestao.com.br`)"
        - "traefik.http.routers.brasilteama-https.tls=true"
        - "traefik.http.routers.brasilteama-https.tls.certresolver=letsencryptresolver"
        # Service / loadbalancer
        - "traefik.http.services.brasilteama-svc.loadbalancer.server.port=3000"
        - "traefik.http.services.brasilteama-svc.loadbalancer.healthcheck.path=/"
        - "traefik.http.services.brasilteama-svc.loadbalancer.healthcheck.interval=30s"

networks:
  olmedaNet:
    external: true
